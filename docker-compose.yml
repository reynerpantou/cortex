services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cortex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cortex}
      - POSTGRES_DB=${POSTGRES_DB:-cortex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"       # exposed for local tools (psql, MCP); drop this in prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cortex:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - CORTEX_DATABASE_URL=postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex}@postgres:5432/${POSTGRES_DB:-cortex}?sslmode=disable
      - CORTEX_COOKIE_SECURE=false   # set true behind HTTPS
      - CORTEX_ADMIN_USER=admin
      # Set a password to seed a known login on first run; otherwise one is
      # generated and printed to the logs exactly once.
      # - CORTEX_ADMIN_PASSWORD=change-me
      # AI layer (next slice) — leave unset to keep AI disabled:
      # - ANTHROPIC_API_KEY=sk-ant-...
    restart: unless-stopped

volumes:
  pgdata:
