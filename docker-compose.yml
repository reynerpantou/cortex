# Both ports are bound to 127.0.0.1: nothing here is reachable from the
# internet directly. On a server, put an HTTPS reverse proxy (see README,
# "Deploying to a VPS") in front of 127.0.0.1:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cortex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-cortex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Local tools only (psql, `make dev-api`). Never publish this publicly.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cortex:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - CORTEX_DATABASE_URL=postgres://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}?sslmode=disable
      # Secure cookies need HTTPS; browsers also allow them on http://localhost.
      - CORTEX_COOKIE_SECURE=${CORTEX_COOKIE_SECURE:-true}
      # The reverse proxy's address, so sign-in limits see the visitor's real
      # IP. Docker's bridge network covers a proxy on the host or in compose.
      - CORTEX_TRUSTED_PROXIES=${CORTEX_TRUSTED_PROXIES:-172.16.0.0/12}
      # The address people open Cortex at; Google and Apple send them back here.
      - CORTEX_PUBLIC_URL=${CORTEX_PUBLIC_URL:-http://localhost:8080}
      # The owner account created on first run, and the Google/Apple email
      # that signs in as it.
      - CORTEX_ADMIN_USER=${CORTEX_ADMIN_USER:-admin}
      - CORTEX_ADMIN_EMAIL=${CORTEX_ADMIN_EMAIL:-}
      # Sign-in providers — see README, "Sign-in with Google and Apple".
      - CORTEX_GOOGLE_CLIENT_ID=${CORTEX_GOOGLE_CLIENT_ID:-}
      - CORTEX_GOOGLE_CLIENT_SECRET=${CORTEX_GOOGLE_CLIENT_SECRET:-}
      - CORTEX_APPLE_CLIENT_ID=${CORTEX_APPLE_CLIENT_ID:-}
      - CORTEX_APPLE_TEAM_ID=${CORTEX_APPLE_TEAM_ID:-}
      - CORTEX_APPLE_KEY_ID=${CORTEX_APPLE_KEY_ID:-}
      - CORTEX_APPLE_PRIVATE_KEY=${CORTEX_APPLE_PRIVATE_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

volumes:
  pgdata:
